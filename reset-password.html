<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password – Nexkittool</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0ebff 0%,#fff5f2 100%);padding:16px}
  .card{background:#fff;border-radius:24px;padding:40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.12)}
  .logo{text-align:center;font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#6c47ff,#ff6b47);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
  .sub{text-align:center;color:#6b7280;font-size:.88rem;margin-bottom:28px}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:#374151}
  input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:.95rem;outline:none;font-family:inherit;transition:border-color .2s;margin-bottom:16px}
  input:focus{border-color:#6c47ff}
  .btn{width:100%;padding:14px;background:linear-gradient(135deg,#6c47ff,#ff6b47);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:16px;display:none}
  .msg.error{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}
  .msg.success{background:#d1fae5;color:#059669;border:1px solid #6ee7b7}
  .bar-wrap{height:4px;background:#e5e7eb;border-radius:2px;overflow:hidden;margin-bottom:4px}
  .bar{height:100%;width:0;border-radius:2px;transition:all .3s}
  .hint{font-size:.75rem;color:#9ca3af;margin-bottom:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡ Nexkittool</div>
  <p class="sub">Set your new password below</p>
  <div id="msgBox" class="msg"></div>
  <div id="formWrap">
    <label>New Password</label>
    <input type="password" id="pass1" placeholder="Minimum 6 characters" oninput="checkStr(this.value)">
    <div class="bar-wrap"><div id="passBar" class="bar"></div></div>
    <div id="passHint" class="hint"></div>
    <label>Confirm Password</label>
    <input type="password" id="pass2" placeholder="Re-enter password">
    <button class="btn" id="resetBtn" onclick="doReset()">🔑 Reset Password</button>
  </div>
  <div id="doneWrap" style="display:none;text-align:center;padding:16px 0">
    <div style="font-size:3rem">✅</div>
    <h3 style="color:#059669;margin:12px 0 6px">Password Reset!</h3>
    <p style="color:#6b7280;margin-bottom:20px">Your password has been updated successfully.</p>
    <a href="/" style="background:linear-gradient(135deg,#6c47ff,#ff6b47);color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:700;display:inline-block">Go to Nexkittool →</a>
  </div>
</div>
<script>
function getToken() {
  return new URLSearchParams(window.location.search).get('token');
}
function showMsg(msg, type) {
  const el = document.getElementById('msgBox');
  el.textContent = msg; el.className = 'msg ' + type; el.style.display = 'block';
}
function checkStr(val) {
  const bar = document.getElementById('passBar'), hint = document.getElementById('passHint');
  let s = 0;
  if (val.length >= 6) s++; if (val.length >= 10) s++;
  if (/[A-Z]/.test(val)) s++; if (/[0-9]/.test(val)) s++; if (/[^A-Za-z0-9]/.test(val)) s++;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e','#16a34a'];
  const labels = ['Very weak','Weak','Fair','Strong','Very strong'];
  bar.style.width = (s*20)+'%'; bar.style.background = colors[s-1]||'#e5e7eb';
  hint.textContent = val ? (labels[s-1]||'') : '';
}
async function doReset() {
  const token = getToken();
  if (!token) { showMsg('Invalid or missing reset link. Please request a new one.', 'error'); return; }
  const pass1 = document.getElementById('pass1').value;
  const pass2 = document.getElementById('pass2').value;
  if (!pass1 || pass1.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
  if (pass1 !== pass2) { showMsg('Passwords do not match.', 'error'); return; }
  const btn = document.getElementById('resetBtn');
  btn.disabled = true; btn.textContent = 'Resetting...';
  try {
    const r = await fetch('/api/auth/reset-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, password: pass1 })
    });
    const data = await r.json();
    if (data.ok) {
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('doneWrap').style.display = 'block';
      document.getElementById('msgBox').style.display = 'none';
    } else {
      showMsg(data.error || 'Something went wrong.', 'error');
      btn.disabled = false; btn.textContent = '🔑 Reset Password';
    }
  } catch(e) {
    showMsg('Network error. Please try again.', 'error');
    btn.disabled = false; btn.textContent = '🔑 Reset Password';
  }
}
// If no token in URL, show error immediately
window.addEventListener('DOMContentLoaded', () => {
  if (!getToken()) {
    showMsg('Invalid reset link. Please request a new password reset.', 'error');
    document.getElementById('formWrap').style.display = 'none';
  }
});
</script>
</body>
</html>
